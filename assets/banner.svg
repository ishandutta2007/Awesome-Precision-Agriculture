<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06130b" />
      <stop offset="50%" stop-color="#0a2014" />
      <stop offset="100%" stop-color="#040d07" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Field Rows Gradient -->
    <linearGradient id="field-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#166534" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#052e16" stop-opacity="0.9" />
    </linearGradient>

    <!-- Scan Beam Gradient -->
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="ag-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22c55e" stroke-width="0.75" stroke-opacity="0.15" />
    </pattern>

    <!-- Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.04); }
    }
    @keyframes radarScan {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes scanSweep {
      0% { transform: translateX(-150px); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateX(950px); opacity: 0; }
    }
    @keyframes droneHover {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1.5deg); }
    }
    @keyframes satOrbit {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(6px, -4px); }
    }
    @keyframes signalPulse {
      0% { r: 4; opacity: 1; stroke-width: 2; }
      100% { r: 28; opacity: 0; stroke-width: 0.5; }
    }
    .grid-bg { opacity: 0.8; }
    .radar-beam { transform-origin: 1050px 90px; animation: radarScan 10s linear infinite; }
    .scanner-line { animation: scanSweep 7s ease-in-out infinite; }
    .drone-unit { animation: droneHover 4s ease-in-out infinite; }
    .sat-unit { animation: satOrbit 6s ease-in-out infinite; }
    .pulse-ring-1 { animation: signalPulse 3s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
    .pulse-ring-2 { animation: signalPulse 3s cubic-bezier(0.2, 0.8, 0.2, 1) infinite 1.5s; }
  </style>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bg-grad)" />
  <rect width="1200" height="420" fill="url(#ag-grid)" class="grid-bg" />

  <!-- Ambient Glow Circles -->
  <circle cx="250" cy="120" r="160" fill="#15803d" opacity="0.2" filter="url(#glow)" />
  <circle cx="950" cy="220" r="180" fill="#0284c7" opacity="0.15" filter="url(#glow)" />

  <!-- Field Contour / Perspective Crop Rows (NDVI Zones) -->
  <g opacity="0.75">
    <path d="M 0 420 L 350 260 L 850 260 L 1200 420 Z" fill="url(#field-grad)" />
    <!-- Crop Row Lines converging into perspective -->
    <line x1="600" y1="260" x2="600" y2="420" stroke="#4ade80" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="6,6" />
    <line x1="550" y1="260" x2="420" y2="420" stroke="#86efac" stroke-width="1.5" stroke-opacity="0.35" />
    <line x1="500" y1="260" x2="240" y2="420" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.3" />
    <line x1="450" y1="260" x2="50" y2="420" stroke="#16a34a" stroke-width="1.5" stroke-opacity="0.3" />
    <line x1="650" y1="260" x2="780" y2="420" stroke="#86efac" stroke-width="1.5" stroke-opacity="0.35" />
    <line x1="700" y1="260" x2="960" y2="420" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.3" />
    <line x1="750" y1="260" x2="1150" y2="420" stroke="#16a34a" stroke-width="1.5" stroke-opacity="0.3" />

    <!-- Precision Scanning Crosshairs & Laser Sweep -->
    <g class="scanner-line">
      <line x1="200" y1="260" x2="200" y2="420" stroke="#38bdf8" stroke-width="2" opacity="0.8" filter="url(#glow)" />
      <polygon points="170,260 230,260 260,420 140,420" fill="url(#beam-grad)" opacity="0.4" />
    </g>
  </g>

  <!-- Top Right Satellite System -->
  <g class="sat-unit" transform="translate(1000, 70)">
    <!-- Signal rings -->
    <circle cx="50" cy="20" r="10" fill="none" stroke="#38bdf8" class="pulse-ring-1" />
    <circle cx="50" cy="20" r="10" fill="none" stroke="#4ade80" class="pulse-ring-2" />
    <!-- Satellite Icon -->
    <g transform="rotate(-30 50 20)">
      <rect x="38" y="12" width="24" height="16" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      <!-- Solar Panels -->
      <rect x="12" y="14" width="22" height="12" rx="1" fill="#0284c7" stroke="#93c5fd" stroke-width="1" />
      <rect x="66" y="14" width="22" height="12" rx="1" fill="#0284c7" stroke="#93c5fd" stroke-width="1" />
      <line x1="23" y1="14" x2="23" y2="26" stroke="#1e293b" stroke-width="1" />
      <line x1="77" y1="14" x2="77" y2="26" stroke="#1e293b" stroke-width="1" />
      <!-- Dish -->
      <path d="M 50 28 L 50 36 M 44 36 A 6 6 0 0 0 56 36 Z" stroke="#38bdf8" stroke-width="1.5" fill="#38bdf8" />
    </g>
  </g>

  <!-- Drone Scanning Unit -->
  <g class="drone-unit" transform="translate(130, 90)">
    <!-- Drone Body -->
    <ellipse cx="60" cy="40" rx="16" ry="7" fill="#0f172a" stroke="#4ade80" stroke-width="2" />
    <!-- Rotors and Arms -->
    <line x1="35" y1="28" x2="85" y2="52" stroke="#64748b" stroke-width="2.5" />
    <line x1="35" y1="52" x2="85" y2="28" stroke="#64748b" stroke-width="2.5" />
    <ellipse cx="33" cy="27" rx="12" ry="3" fill="none" stroke="#a3e635" stroke-width="1.5" />
    <ellipse cx="87" cy="27" rx="12" ry="3" fill="none" stroke="#a3e635" stroke-width="1.5" />
    <ellipse cx="33" cy="53" rx="12" ry="3" fill="none" stroke="#a3e635" stroke-width="1.5" />
    <ellipse cx="87" cy="53" rx="12" ry="3" fill="none" stroke="#a3e635" stroke-width="1.5" />
    <!-- Sensor Pod / Downward Beam -->
    <circle cx="60" cy="45" r="3" fill="#22c55e" filter="url(#glow)" />
    <polygon points="60,45 10,180 110,180" fill="url(#beam-grad)" opacity="0.35" />
  </g>

  <!-- Center Typography & Branding -->
  <g id="brand-text">
    <!-- Super Header Badge -->
    <g transform="translate(600, 68)">
      <rect x="-190" y="-16" width="380" height="32" rx="16" fill="#14532d" fill-opacity="0.6" stroke="#22c55e" stroke-width="1.2" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#86efac" letter-spacing="2.5" text-anchor="middle">
        🌱 THE OPEN AGTECH ECOSYSTEM
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" fill="url(#title-grad)" letter-spacing="0.5" text-anchor="middle" filter="url(#glow)">
      Awesome Precision Agriculture
    </text>

    <!-- Subtitle -->
    <text x="600" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="#e2e8f0" letter-spacing="0.8" text-anchor="middle">
      Curated Catalog of SaaS Platforms, Autonomous Guidance, Satellite NDVI &amp; Open-Source Tools
    </text>

    <!-- Pill Feature Badges -->
    <g transform="translate(600, 225)">
      <!-- Badge 1: Farm Intelligence -->
      <g transform="translate(-270, 0)">
        <rect x="-80" y="-13" width="160" height="26" rx="13" fill="#0f172a" stroke="#22c55e" stroke-width="1" />
        <text x="0" y="4" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#4ade80" text-anchor="middle">🚜 GPS Autosteer</text>
      </g>
      <!-- Badge 2: Satellite Remote Sensing -->
      <g transform="translate(-90, 0)">
        <rect x="-85" y="-13" width="170" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
        <text x="0" y="4" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#7dd3fc" text-anchor="middle">🛰️ Satellite NDVI</text>
      </g>
      <!-- Badge 3: Drone AI Vision -->
      <g transform="translate(90, 0)">
        <rect x="-85" y="-13" width="170" height="26" rx="13" fill="#0f172a" stroke="#a3e635" stroke-width="1" />
        <text x="0" y="4" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#bef264" text-anchor="middle">🤖 Crop AI &amp; CV</text>
      </g>
      <!-- Badge 4: IoT & Sensors -->
      <g transform="translate(270, 0)">
        <rect x="-80" y="-13" width="160" height="26" rx="13" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
        <text x="0" y="4" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#fcd34d" text-anchor="middle">💧 Soil &amp; IoT Sensing</text>
      </g>
    </g>
  </g>
</svg>
